{# _logo_mark.html — SVG del ícono de marca Mochi Matcha (tazón + flor de cerezo). #}
{# Incluir con: {% include 'base/_logo_mark.html' %}                               #}
{# Escala con width/height del contenedor SVG. viewBox="0 0 44 44".               #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img" aria-label="Mochi Matcha" style="display:block;">
  <!-- Fondo circular verde -->
  <circle cx="22" cy="22" r="21" fill="#3D6B4F"/>
  <!-- Anillo dorado decorativo -->
  <circle cx="22" cy="22" r="20" fill="none" stroke="#C9933A" stroke-width="1.3" opacity="0.55"/>
  <!-- Tazón de matcha (trapezoide: ancho arriba, estrecho abajo) -->
  <path d="M11.5 22 L15 31.5 Q15 33 22 33 Q29 33 29 31.5 L32.5 22 Z" fill="white" opacity="0.92"/>
  <!-- Borde / boca del tazón (elipse superior) -->
  <ellipse cx="22" cy="22" rx="10.5" ry="3.2" fill="rgba(255,255,255,0.45)"/>
  <!-- Superficie del matcha (interior oscuro) -->
  <ellipse cx="22" cy="22" rx="7.5" ry="2" fill="#2A4A36"/>
  <!-- Línea de espuma (ola suave sobre el matcha) -->
  <path d="M17.5 21.5 Q19.5 20.3 22 21.5 Q24.5 20.3 26.5 21.5"
        stroke="rgba(106,159,122,0.7)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Flor de cerezo (sakura) en la esquina superior derecha -->
  <g transform="translate(31,11)">
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#F5DDD5" transform="rotate(0)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#F5DDD5" transform="rotate(72)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#F5DDD5" transform="rotate(144)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#F5DDD5" transform="rotate(216)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#F5DDD5" transform="rotate(288)"/>
    <!-- Centro dorado de la flor -->
    <circle cx="0" cy="0" r="2.1" fill="#C9933A"/>
    <circle cx="0" cy="0" r="0.9" fill="rgba(255,255,255,0.75)"/>
  </g>
</svg>
